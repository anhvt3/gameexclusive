name: CI — Game_SS3_exclusive

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (advisory only — pre-existing main-branch drift)
        run: npm run format:check
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Verify AP compliance
        run: npm run verify

      - name: Build
        run: npm run build

  api:
    name: API Typecheck (Phase 5 Vercel functions)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci || npm install

      - name: API typecheck
        run: npm run typecheck

  schema-drift:
    name: SQL schema drift (Postgres UAT vs MySQL canonical)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run drift check
        run: node scripts/check_sql_drift.mjs

  e2e:
    name: E2E Tests (advisory — Phaser canvas flake on CI runners)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: harness
    # Phaser canvas + WebGL init on ubuntu-latest GitHub Actions runners is
    # consistently slow / flaky (canvas waitFor times out even at 30s on
    # multiple specs: equipment_damage, full_flow, multiparty_combat, etc).
    # Pre-existing flake unrelated to Phase 5. Mark advisory until a
    # dedicated investigation lands (Phase 6 task: switch to software WebGL
    # OR use Vercel Preview URL for E2E instead of local dev). Harness gates,
    # API typecheck, schema-drift remain hard CI gates.
    continue-on-error: true
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

  task-classification-check:
    name: Task A/B/C label enforcement
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce Task A/B/C label
        uses: mheap/github-action-required-labels@v5
        with:
          mode: exactly
          count: 1
          labels: 'type-A, type-B, type-C'
          exit_type: failure

      - name: Type-B requires posup-approved
        if: contains(github.event.pull_request.labels.*.name, 'type-B')
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 1
          labels: 'posup-approved'
          exit_type: failure

      - name: Type-C requires posup + arch approval
        if: contains(github.event.pull_request.labels.*.name, 'type-C')
        uses: mheap/github-action-required-labels@v5
        with:
          mode: minimum
          count: 2
          labels: 'posup-approved, arch-approved'
          exit_type: failure
